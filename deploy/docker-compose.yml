# Growlyze Property AI Agent — self-contained stack.
# Joins the server's existing Traefik only through labels on `web`; nothing
# publishes a host port, and all other traffic stays on the private network.
#
#   cd deploy && cp .env.example .env   # then fill in secrets
#   docker compose up -d --build
#   docker compose run --rm api sh -c "npm run db:seed && npm run db:seed:demo"   # first time only
name: growlyze-property

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]
    mem_limit: 128m

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: growlyze-property-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal]
    volumes:
      - uploads:/app/backend/uploads
    mem_limit: 1g

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: growlyze-property-web:latest
    restart: unless-stopped
    depends_on: [api]
    networks: [internal, traefik-public]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.growlyze-property.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.growlyze-property.entrypoints=websecure
      - traefik.http.routers.growlyze-property.tls.certresolver=mytlschallenge
      - traefik.http.services.growlyze-property.loadbalancer.server.port=80
    mem_limit: 128m

volumes:
  db-data:
  uploads:

networks:
  internal:
    name: growlyze-property-internal
  traefik-public:
    external: true
